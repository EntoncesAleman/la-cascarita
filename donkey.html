<!doctype html><html lang="es"><head><meta charset="utf-8"><script src="i18n-data.js"></script><script src="i18n.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ponele la cola al burro · Una tarea insignificante</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efdf;color:#35432e;font-family:system-ui,sans-serif}main{max-width:950px;margin:auto;padding:25px}a{color:inherit}h1{font-size:clamp(30px,5vw,53px);letter-spacing:-2px;margin-bottom:12px}p{line-height:1.6}.field{position:relative;aspect-ratio:3/2;background:linear-gradient(#dbe5c6 0 52%,#c1cb9a 52% 60%,#dccc9d 60%);border:1px solid #c6c8a7;border-radius:20px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.field:before{content:'';position:absolute;left:0;right:0;top:48%;height:35px;background:repeating-linear-gradient(90deg,#e8d7ad 0 12px,transparent 12px 82px);border-top:9px solid #e8d7ad;border-bottom:9px solid #e8d7ad}.animal{position:absolute;width:65%;left:17%;top:16%;transition:transform .25s;pointer-events:none}.tail{position:absolute;left:10%;top:72%;width:65px;height:65px;pointer-events:none;filter:drop-shadow(2px 4px 2px #544c4255)}button{font:inherit;padding:13px 20px;min-height:44px;border-radius:9px;border:1px solid #8b9d74;background:#42583b;color:#fff8e5;cursor:pointer}.status{min-height:52px;padding:12px;background:#e3e8d2;border-radius:8px}dialog{border:1px solid #a7ac8c;border-radius:18px;max-width:370px;background:#faf3df;color:#594c36;padding:30px;text-align:center}dialog::backdrop{background:#293b2966}.kick{animation:donkey-kick .3s 2}.help{font-size:13px;color:#758066}@media(prefers-reduced-motion:reduce){.animal{transition:none}}</style><script src="journey.js"></script><script src="donkey.js"></script></head><body><main><a href="index.html">← Una tarea insignificante</a><p>UNA COLA. UN BURRO.</p><h1>Ponele la cola al burro.</h1><p>Acercate despacio y ponele la cola.</p><p class="status" id="status" role="status">Cuando quieras.</p><div class="field" id="field" tabindex="0" role="application" aria-label="Mové la cola hacia el burro con el dedo, mouse o flechas y espacio."><div class="animal" id="animal"></div><svg class="tail" id="tail" viewBox="0 0 80 80" aria-hidden="true"><path d="M17 8q51 11 29 49" fill="none" stroke="#978475" stroke-width="10" stroke-linecap="round"/><path d="M44 48L30 76l31-9z" fill="#534b44"/></svg></div><p class="help">Arrastrá desde cualquier parte. En teclado: flechas para acercar la cola y espacio para colocarla.</p><button id="start">Empezar</button><dialog id="end"><h2>GAME OVER</h2><p>El burro se escapó. La cola sigue con vos.</p><button id="again">Jugar de nuevo</button></dialog></main><script>
'use strict';
const field=document.getElementById('field'),animal=document.getElementById('animal'),tail=document.getElementById('tail'),status=document.getElementById('status'),end=document.getElementById('end');animal.innerHTML=Donkey.svg;
let playing=false,time=0,attempts=0,point={x:13,y:77},pointer=null,last=0,offset=0;
function start(){playing=true;time=0;attempts=0;offset=0;point={x:13,y:77};pointer=null;end.close();document.getElementById('start').textContent='Jugar de nuevo';status.textContent='Despacio. Parece tranquilo.';field.focus();paint()}
function paint(){tail.style.left=point.x+'%';tail.style.top=point.y+'%';animal.style.transform=`translate(${offset}%,${Math.sin(time*2)*2}%)`}
function kick(){attempts++;offset=15+Math.random()*18;animal.classList.remove('kick');void animal.offsetWidth;animal.classList.add('kick');point={x:10,y:77};status.textContent=['¡Cuidado con las patas!','Casi. Se corrió justo.','No parece querer la cola.'][attempts%3];if(attempts>=5)finish()}
function finish(){if(!playing)return;playing=false;pointer=null;animal.style.transform='translateX(150%)';status.textContent='Se fue. Ni siquiera miró atrás.';Journey.next('donkey',end);end.showModal()}
function move(e){if(!playing||e.pointerId!==pointer)return;const r=field.getBoundingClientRect();point={x:Math.max(0,Math.min(90,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(90,(e.clientY-r.top)/r.height*100))};if(point.x>23+offset*.65&&point.y>29&&point.y<75)kick();paint()}
field.addEventListener('pointerdown',e=>{if(!playing)return;e.preventDefault();pointer=e.pointerId;field.setPointerCapture(pointer);move(e)});field.addEventListener('pointermove',move);for(const name of ['pointerup','pointercancel','lostpointercapture'])field.addEventListener(name,()=>pointer=null);field.addEventListener('contextmenu',e=>e.preventDefault());field.addEventListener('keydown',e=>{if(!playing)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();if(e.key===' ')kick();point.x+=e.key==='ArrowRight'?4:e.key==='ArrowLeft'?-4:0;point.y+=e.key==='ArrowDown'?4:e.key==='ArrowUp'?-4:0;point.x=Math.max(0,Math.min(90,point.x));point.y=Math.max(0,Math.min(90,point.y));paint()}});document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(playing&&!document.hidden){time+=dt;offset=Math.sin(time*.9)*10;if(time>18)status.textContent='Se está impacientando…';if(time>24)finish();else paint()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
